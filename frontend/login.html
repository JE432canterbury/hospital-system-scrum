<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Portal - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Medical Portal Login</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="role">Login as:</label>
                    <select id="role" name="role" required>
                        <option value="">Select Role</option>
                        <option value="Patient">Patient</option>
                        <option value="Doctor">Doctor</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                        <button type="button" id="togglePassword" class="toggle-password">
                            <span id="eyeIcon">Show</span>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <p style="text-align: center; margin-top: 1rem;">
                    Don't have an account? <a href="signup.html" style="color: #007bff; text-decoration: none;">Sign up</a>
                </p>
            </form>
        </div>
    </div>
    
    <script type="module" src="js/auth-frontend.js"></script>
</body>
</html>
