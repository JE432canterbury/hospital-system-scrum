<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Records - Hospital Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/medical-records.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Hospital Portal</h1>
            <nav class="nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="appointment-booking.html">Book Appointment</a>
                <a href="appointment-management.html">My Appointments</a>
                <a href="medical-records.html" class="active">Medical Records</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="medical-records-container">
                <h2 class="page-title">My Medical Records</h2>
                
                <!-- Loading State -->
                <div id="loadingState" class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading your medical records...</p>
                </div>

                <!-- Error State -->
                <div id="errorState" class="error-state" style="display: none;">
                    <div class="error-icon"></div>
                    <h3>Unable to Load Medical Records</h3>
                    <p id="errorMessage">Please try again later.</p>
                    <button class="btn btn-primary" onclick="loadMedicalRecords()">Retry</button>
                </div>

                <!-- Medical Records Content -->
                <div id="medicalRecordsContent" class="medical-records-content" style="display: none;">
                    <!-- Medical Records Section -->
                    <div class="records-section">
                        <h3 class="section-title">
                            Medical History
                        </h3>
                        <div id="medicalRecordsList" class="records-list">
                            <!-- Medical records will be populated here -->
                        </div>
                    </div>

                    <!-- Prescriptions Section -->
                    <div class="records-section">
                        <h3 class="section-title">
                            Prescriptions
                        </h3>
                        <div id="prescriptionsList" class="records-list">
                            <!-- Prescriptions will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
        </div>
    </footer>

    <script type="module" src="js/medical-records.js"></script>
</body>
</html>
