<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - Hospital Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/booking.css">
    <link rel="stylesheet" href="css/appointments.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo"> Hospital Portal</h1>
            <nav class="nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="appointment-booking.html">Book Appointment</a>
                <a href="appointment-management.html">My Appointments</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="appointments-container">
                <h2 class="page-title">My Appointments</h2>
                
                <!-- Appointments List -->
                <div id="appointmentsList" class="appointments-list">
                    <!-- Appointments will be loaded dynamically -->
                </div>
                
                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-icon"></div>
                    <h3>No Appointments Found</h3>
                    <p>You don't have any scheduled appointments.</p>
                    <button class="btn btn-primary" onclick="window.location.href='appointment-booking.html'">
                        Book Your First Appointment
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Reschedule Modal -->
    <div id="rescheduleModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Reschedule Appointment</h3>
                <span class="close" onclick="closeRescheduleModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="rescheduleDate">New Date:</label>
                    <input type="date" id="rescheduleDate" class="form-control" onchange="onRescheduleDateChange()" required>
                </div>
                <div class="form-group">
                    <label for="rescheduleTime">New Time:</label>
                    <select id="rescheduleTime" class="form-control" required>
                        <option value="">Select Time</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeRescheduleModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmReschedule()">Reschedule</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
        </div>
    </footer>

    <script type="module" src="js/appointment-management.js"></script>
</body>
</html>
